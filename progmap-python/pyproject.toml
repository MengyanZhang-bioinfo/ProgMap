[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "progmap"
version = "0.1.0"
description = "Leakage-safe stage-associated multi-omics feature discovery with a fixed 2048-128 skip neural network"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = "MIT"
authors = [
  {name = "ProgMap authors"}
]
dependencies = [
  "joblib>=1.3,<1.5",
  "numpy>=1.23.5,<2",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<1.6",
  "scipy>=1.10,<1.14",
  "statsmodels>=0.14,<0.15",
  "tensorflow==2.14.0",
  "tqdm>=4.66,<5"
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
progmap = "progmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
