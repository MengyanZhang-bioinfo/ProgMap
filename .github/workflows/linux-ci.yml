name: Linux CI

on:
  push:
    branches: [main]
    paths:
      - "progmap-python/**"
      - ".github/workflows/linux-ci.yml"
  pull_request:
    paths:
      - "progmap-python/**"
      - ".github/workflows/linux-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: progmap-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: progmap-python/requirements-linux-cpu.txt
      - name: Install reference Linux environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux-cpu.txt
          python -m pip install --no-deps -e .
      - name: Unit and end-to-end tests
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m pytest
      - name: Command-line and input smoke test
        run: |
          progmap --help
          python examples/create_synthetic_data.py --output /tmp/progmap/PANCANCER
          progmap --data-root /tmp/progmap/PANCANCER --output /tmp/progmap/input_check --dry-run --device cpu
          progmap --data-root /tmp/progmap/PANCANCER --output /tmp/progmap/results \
            --folds 2 --inner-folds 2 --epochs 1 --patience 0 \
            --ig-steps 3 --ig-baselines 1 --max-attribution-samples-per-class 2 \
            --top-n 3 --no-save-models --no-save-attributions --no-progress --quiet --device cpu
      - name: Build source and wheel distributions
        run: python -m build
